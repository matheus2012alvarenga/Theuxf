<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardião IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Space Grotesk', sans-serif; background-color: #f0f4f8; }
        .brutal-border { border: 3px solid #000000; box-shadow: 4px 4px 0px #000000; }
        .brutal-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px #000000; }
        .chat-container { height: calc(100vh - 180px); }
    </style>
</head>
<body class="p-4 md:p-6">
    <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-4 gap-6">
        
        <div class="lg:col-span-1 bg-white p-4 rounded-2xl brutal-border flex flex-col justify-between h-fit lg:h-[calc(100vh-50px)]">
            <div>
                <div class="flex items-center gap-3 mb-6">
                    <div class="p-2 bg-emerald-100 rounded-xl border-2 border-black">
                        <i data-lucide="shield" class="w-6 h-6 text-emerald-600"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-black tracking-tight">Guardião IA</h1>
                        <span class="inline-flex items-center gap-1 bg-emerald-50 text-emerald-700 text-[10px] font-bold px-2 py-0.5 rounded-full border border-emerald-300">
                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> SAFE
                        </span>
                    </div>
                </div>

                <div class="space-y-4">
                    <div class="space-y-1">
                        <label class="text-[10px] font-black uppercase text-slate-500 tracking-wider">ID do Usuário</label>
                        <div class="relative">
                            <i data-lucide="user" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
                            <input type="text" id="userIdInput" value="jovem_estudante_1" class="w-full pl-9 pr-3 py-2 bg-slate-50 brutal-border rounded-xl text-xs font-bold focus:outline-none">
                        </div>
                    </div>

                    <div class="space-y-2">
                        <label class="text-[10px] font-black uppercase text-slate-500 tracking-wider">Assistente</label>
                        <button id="btnTutor" onclick="setMode('tutor')" class="w-full flex items-center gap-3 p-3 bg-amber-50 rounded-xl border-2 border-black text-left">
                            <i data-lucide="graduation-cap" class="w-5 h-5 text-amber-600"></i>
                            <div>
                                <div class="text-xs font-bold">Tutor Escolar</div>
                                <div class="text-[10px] text-slate-500">Respostas e auxílio didático</div>
                            </div>
                        </button>
                        <button id="btnStory" onclick="setMode('story')" class="w-full flex items-center gap-3 p-3 bg-slate-50 rounded-xl border-2 border-transparent text-left hover:bg-slate-100">
                            <i data-lucide="sparkles" class="w-5 h-5 text-purple-600"></i>
                            <div>
                                <div class="text-xs font-bold">Contar Histórias</div>
                                <div class="text-[10px] text-slate-500">Contos mágicos e seguros</div>
                            </div>
                        </button>
                    </div>
                </div>
            </div>

            <button onclick="limparHistorico()" class="w-full mt-6 py-2 bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold text-xs rounded-xl border-2 border-rose-300 flex items-center justify-center gap-2 transition-all">
                <i data-lucide="trash-2" class="w-4 h-4"></i> Limpar Histórico
            </button>
        </div>

        <div class="lg:col-span-3 flex flex-col justify-between bg-white rounded-2xl brutal-border h-[calc(100vh-50px)] overflow-hidden">
            <div class="bg-slate-900 text-white p-3 px-4 flex items-center justify-between border-b-4 border-black">
                <span id="chatModeTitle" class="text-[10px] font-black uppercase tracking-widest text-amber-400">MODO TUTOR ATIVO</span>
            </div>

            <div id="chatBox" class="flex-1 p-4 overflow-y-auto space-y-4 bg-slate-50">
                <div class="flex items-start gap-3">
                    <div class="p-1.5 bg-slate-900 text-white rounded-lg border border-black"><i data-lucide="bot" class="w-4 h-4"></i></div>
                    <div class="bg-white p-3 rounded-2xl border-2 border-black max-w-[80%] text-sm font-medium">
                        Olá! Eu sou o seu assistente inteligente Guardião IA. Como posso te ajudar hoje? 😊
                    </div>
                </div>
            </div>

            <div class="p-4 bg-white border-t-4 border-black">
                <form id="chatForm" onsubmit="enviarMensagem(event)" class="flex items-center gap-2 bg-white brutal-border rounded-xl p-2 relative">
                    
                    <label class="p-2 hover:bg-slate-100 rounded-lg cursor-pointer flex items-center justify-center transition-all">
                        <i data-lucide="paperclip" id="clipIcon" class="w-5 h-5 text-slate-500"></i>
                        <input type="file" id="fileInput" onchange="atualizarStatusArquivo()" class="hidden" accept="image/*,video/*,audio/*,application/pdf">
                    </label>

                    <input type="text" id="messageInput" placeholder="Escreva sua mensagem aqui..." class="flex-1 bg-transparent py-2 px-1 text-sm font-medium focus:outline-none" autocomplete="off">
                    
                    <button type="submit" class="p-2.5 bg-slate-900 text-white rounded-lg hover:bg-slate-800 brutal-btn transition-all">
                        <i data-lucide="send" class="w-4 h-4"></i>
                    </button>
                </form>
                <div id="filePreview" class="text-[10px] text-emerald-600 font-bold mt-1 px-2 hidden"></div>
            </div>
        </div>

    </div>

    <script>
        lucide.createIcons();
        let currentMode = "tutor";

        function setMode(mode) {
            currentMode = mode;
            const btnTutor = document.getElementById("btnTutor");
            const btnStory = document.getElementById("btnStory");
            const title = document.getElementById("chatModeTitle");

            if(mode === "tutor") {
                btnTutor.className = "w-full flex items-center gap-3 p-3 bg-amber-50 rounded-xl border-2 border-black text-left";
                btnStory.className = "w-full flex items-center gap-3 p-3 bg-slate-50 rounded-xl border-2 border-transparent text-left hover:bg-slate-100";
                title.innerText = "MODO TUTOR ATIVO";
                title.className = "text-[10px] font-black uppercase tracking-widest text-amber-400";
            } else {
                btnStory.className = "w-full flex items-center gap-3 p-3 bg-purple-50 rounded-xl border-2 border-black text-left";
                btnTutor.className = "w-full flex items-center gap-3 p-3 bg-slate-50 rounded-xl border-2 border-transparent text-left hover:bg-slate-100";
                title.innerText = "MODO HISTÓRIA ATIVO";
                title.className = "text-[10px] font-black uppercase tracking-widest text-purple-400";
            }
        }

        function actualizarStatusArquivo() {
            const input = document.getElementById("fileInput");
            const preview = document.getElementById("filePreview");
            const icon = document.getElementById("clipIcon");
            if (input.files.length > 0) {
                preview.innerText = `📎 Arquivo pronto: ${input.files[0].name}`;
                preview.classList.remove("hidden");
                icon.classList.remove("text-slate-500");
                icon.classList.add("text-emerald-600");
            } else {
                preview.classList.add("hidden");
                icon.classList.remove("text-emerald-600");
                icon.classList.add("text-slate-500");
            }
        }

        function appendMessage(role, text) {
            const chatBox = document.getElementById("chatBox");
            const msgDiv = document.createElement("div");
            msgDiv.className = `flex items-start gap-3 ${role === 'user' ? 'justify-end' : ''}`;

            const botIcon = `<div class="p-1.5 bg-slate-900 text-white rounded-lg border border-black"><i data-lucide="bot" class="w-4 h-4"></i></div>`;
            const userTag = `<div class="text-[9px] font-black uppercase p-1 bg-slate-200 rounded-md border border-black">ME</div>`;

            msgDiv.innerHTML = `
                ${role === 'model' ? botIcon : ''}
                <div class="${role === 'user' ? 'bg-slate-800 text-white' : 'bg-white text-black'} p-3 rounded-2xl border-2 border-black max-w-[80%] text-sm font-medium whitespace-pre-wrap">
                    ${text}
                </div>
                ${role === 'user' ? userTag : ''}
            `;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            lucide.createIcons();
        }

        function appendError(text) {
            const chatBox = document.getElementById("chatBox");
            const errorDiv = document.createElement("div");
            errorDiv.className = "flex items-start gap-3";
            errorDiv.innerHTML = `
                <div class="p-1.5 bg-slate-900 text-white rounded-lg border border-black"><i data-lucide="bot" class="w-4 h-4"></i></div>
                <div class="bg-rose-50 text-rose-700 p-3 rounded-2xl border-2 border-rose-400 max-w-[80%] text-sm font-bold">
                    ${text}
                </div>
            `;
            chatBox.appendChild(errorDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            lucide.createIcons();
        }

        async function enviarMensagem(event) {
            event.preventDefault();
            const msgInput = document.getElementById("messageInput");
            const fileInput = document.getElementById("fileInput");
            const userId = document.getElementById("userIdInput").value;
            const message = msgInput.value.trim();

            if (!message && fileInput.files.length === 0) return;

            appendMessage("user", message || "📁 Enviou um arquivo para análise.");
            msgInput.value = "";

            const formData = new FormData();
            formData.append("user_id", userId);
            formData.append("message", message || "Analise o arquivo anexado.");
            formData.append("mode", currentMode);
            if (fileInput.files[0]) {
                formData.append("file", fileInput.files[0]);
            }

            // Reseta o input de arquivo visualmente
            fileInput.value = "";
            actualizarStatusArquivo();

            try {
                const response = await fetch("/api/chat", { method: "POST", body: formData });
                
                if (response.status === 429) {
                    appendError("Desculpe, o limite diário ou por minuto da minha inteligência artificial foi atingido. Por favor, aguarde de 1 a 2 minutos antes de tentar novamente.");
                    return;
                }

                if (!response.ok) {
                    throw new Error();
                }

                const data = await response.json();
                appendMessage("model", data.response);
            } catch (err) {
                appendError("Desculpe, ocorreu um erro interno ao tentar conectar com o servidor. Verifique sua conexão ou tente novamente.");
            }
        }

        async function limparHistorico() {
            const userId = document.getElementById("userIdInput").value;
            try {
                const res = await fetch("/api/clear", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ user_id: userId })
                });
                if (res.ok) {
                    document.getElementById("chatBox").innerHTML = `
                        <div class="flex items-start gap-3">
                            <div class="p-1.5 bg-slate-900 text-white rounded-lg border border-black"><i data-lucide="bot" class="w-4 h-4"></i></div>
                            <div class="bg-white p-3 rounded-2xl border-2 border-black max-w-[80%] text-sm font-medium">Histórico apagado com sucesso! Como posso te ajudar agora?</div>
                        </div>
                    `;
                    lucide.createIcons();
                }
            } catch (err) {
                alert("Erro ao limpar histórico.");
            }
        }
    </script>
</body>
</html>
